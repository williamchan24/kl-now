<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1026" />
    <meta name="description" content="Kuala Lumpur and Melbourne right now: live time, weather, rain forecast, sunset and air quality, over a sky and skyline that match the real thing." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>KL Now</title>
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>

    <main class="app">
      <header class="top">
        <h1 class="brand"><span id="brand-city">KL</span> <span class="now">Now</span></h1>
        <div class="top-right">
          <div class="cities glass" id="cities" role="group" aria-label="City"></div>
          <button class="pill-btn glass" id="refresh" type="button" aria-label="Refresh weather">↻ <span id="updated">Loading…</span></button>
        </div>
      </header>

      <p class="banner glass" id="banner" hidden></p>

      <div class="grid">
        <section class="hero glass" aria-label="Current conditions">
          <div class="place">📍 <span id="place">Kuala Lumpur</span></div>
          <div class="clock" id="clock" aria-live="off">--:--</div>
          <div class="date" id="date"></div>
          <div class="current">
            <div class="icon" id="icon" aria-hidden="true">⛅</div>
            <div>
              <div class="temp" id="temp">--°</div>
              <div class="cond" id="cond">Loading weather…</div>
              <div class="muted" id="feels"></div>
              <div class="quirk" id="quirk" hidden></div>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><b id="humidity">--</b><span>Humidity</span></div>
            <div class="stat"><b id="wind">--</b><span>Wind</span></div>
            <div class="stat"><b id="uv">--</b><span>UV today</span></div>
          </div>
        </section>

        <div class="side">
          <section class="card glass" aria-labelledby="h-hours">
            <h2 id="h-hours">Next 12 hours</h2>
            <div class="hours" id="hours" tabindex="0" aria-label="Hourly forecast, scrollable"></div>
          </section>

          <section class="card glass" aria-labelledby="h-sun">
            <h2 id="h-sun">Sun</h2>
            <svg class="sun-arc" viewBox="0 0 300 90" preserveAspectRatio="none" aria-hidden="true">
              <path d="M10 85 Q150 -55 290 85" fill="none" stroke="rgba(255,255,255,.35)" stroke-dasharray="4 5" stroke-width="2" />
              <circle id="sun-dot" r="8" fill="#fde68a" cx="10" cy="85" />
            </svg>
            <div class="sun-times"><span id="sunrise">🌅 --</span><span id="daylight"></span><span id="sunset">🌇 --</span></div>
            <p class="muted small" id="sun-note"></p>
          </section>

          <section class="card glass" aria-labelledby="h-air">
            <h2 id="h-air">Air quality</h2>
            <div class="aqi">
              <div class="aqi-num" id="aqi">--</div>
              <div><span class="badge" id="aqi-label">--</span><div class="muted small" id="pm25"></div></div>
            </div>
            <div class="meter" aria-hidden="true"><i id="aqi-mark"></i></div>
          </section>
        </div>
      </div>

      <footer class="foot">
        Weather &amp; air quality by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> ·
        Made by <a href="https://www.williamchanwinghong.com/" target="_blank" rel="noopener">William Chan</a> ·
        <a href="https://github.com/williamchan24/kl-now" target="_blank" rel="noopener">Source</a>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
